<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srcset and Sizes Attributes</title>
</head>
<body>
    <section>
    <div>
    <h2>Responsive Images using Srcset and Sizes Attributes</h2>

        image1/redpanda1280.png 1280w,

    </section>
