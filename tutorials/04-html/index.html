<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srcset and Sizes Attributes</title>
</head>
<body>
    <section>
        <div>
                <h1>Responsive Images</h1>
            <img src="image1/cat-dog-fish.jpg" alt="cat dog fish" width="300" height="200">
        </div>
    </section>
    <section>
    <div>
    <h2>Responsive Images using Srcset and Sizes Attributes</h2>
    <img src="image1/redpanda.png" alt="redpanda"
        srcset="image1/redpanda640.png 640w, 
        image1/redpanda1280.png 1280w,
        image1/redpanda554.png 554w">
    </div>
    </section>
</body>
</html>
