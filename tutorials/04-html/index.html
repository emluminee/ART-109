<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srcset and Sizes Attributes</title>
</head>
<body>
    <section>
        <div>
                <h1>Responsive Images</h1>
            <img src="images/cat-dog-fish.jpg" alt="cat dog fish" width="300" height="200">
        </div>
    </section>
    <section>
    <div>
    <h2>Responsive Images using Srcset and Sizes Attributes</h2>
    <img src="images/redpanda.jpg" alt="redpanda"
        srcset="images/redpanda-554.jpg 554w,
        images/redpanda-640.jpg 640w,
        images/redpanda-1280.jpg 1280w">
    </div>
    </section>
</body>
</html>
